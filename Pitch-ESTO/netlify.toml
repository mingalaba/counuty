[build]
  publish = "."

[[redirects]]
  from = "/pitch-esto"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/pitch-ESTO"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/Pitch-ESTO"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
