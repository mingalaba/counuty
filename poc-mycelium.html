<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counity — Red Micélica</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#030305;overflow:hidden;font-family:'Inter',sans-serif;color:#e0e0e0;cursor:grab}
body.dragging{cursor:grabbing}
canvas{display:block;position:fixed;top:0;left:0}

#info-panel{
  position:fixed;right:-400px;top:50%;transform:translateY(-50%);
  width:340px;padding:2.5rem;z-index:10;
  background:rgba(8,8,15,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.06);border-right:none;
  border-radius:24px 0 0 24px;
  transition:right 0.5s cubic-bezier(0.23,1,0.32,1);
}
#info-panel.visible{right:0}
#info-panel h2{font-size:1.4rem;font-weight:600;margin-bottom:.5rem;letter-spacing:-0.02em}
#info-panel .tag{display:inline-block;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;
  padding:4px 10px;border-radius:100px;margin-bottom:1rem;background:rgba(255,255,255,0.06);color:#aaa}
#info-panel p{font-size:.9rem;line-height:1.7;color:#999;font-weight:300}
#info-panel .close-btn{position:absolute;top:1rem;right:1rem;background:none;border:none;
  color:#555;font-size:1.2rem;cursor:pointer}

#legend{
  position:fixed;bottom:2rem;left:2rem;z-index:10;display:flex;gap:1.5rem;
  font-size:.75rem;color:#555;
}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:8px;height:8px;border-radius:50%}

#hint{
  position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);z-index:10;
  font-size:.8rem;color:#333;letter-spacing:.05em;
  animation:hintPulse 3s ease-in-out infinite;
}
@keyframes hintPulse{0%,100%{opacity:.3}50%{opacity:.8}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="info-panel">
  <button class="close-btn" onclick="closePanel()">&times;</button>
  <span class="tag" id="panel-tag">—</span>
  <h2 id="panel-title">—</h2>
  <p id="panel-desc">—</p>
</div>

<div id="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#00e6b8"></div>Foundation</div>
  <div class="legend-item"><div class="legend-dot" style="background:#00bcd4"></div>Co-Units</div>
  <div class="legend-item"><div class="legend-dot" style="background:#d4a017"></div>Lands</div>
  <div class="legend-item"><div class="legend-dot" style="background:#666"></div>Nodos</div>
</div>

<div id="hint">Arrastrá para explorar · Hover para descubrir</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="poc-mycelium.js"></script>
</body>
</html>
